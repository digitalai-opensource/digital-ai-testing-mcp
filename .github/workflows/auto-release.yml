name: Auto Release

on:
  push:
    branches: [main]

jobs:
  auto-release:
    name: Create release if version is new
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.check.outputs.exists == 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version from package.json
        id: version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest

  # Releases created above use GITHUB_TOKEN, which suppresses the
  # `release: published` event (GitHub recursion prevention) — so release.yml
  # would never fire on its own. Dispatching it as an independent top-level
  # workflow_dispatch run (rather than calling it as a nested reusable
  # workflow via `uses:`) is deliberate: a reusable-workflow call did NOT
  # propagate id-token permission to the npm job even with `id-token: write`
  # declared on both the caller and callee (confirmed live — the npm publish
  # step got ENEEDAUTH, never reaching the OIDC/Trusted Publishing exchange,
  # while Docker's GITHUB_TOKEN-based GHCR login worked fine either way).
  # A direct workflow_dispatch run gives release.yml its own full, ungated
  # permission set — exactly the invocation path already confirmed to work.
  trigger-release:
    name: Dispatch Docker + npm publish
    needs: auto-release
    if: needs.auto-release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --repo digitalai-opensource/digital-ai-testing-mcp \
            -f version=${{ needs.auto-release.outputs.version }}
