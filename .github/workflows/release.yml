name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to tag the image with (e.g. 1.0.0, no leading v). Leave blank to push latest tag only.'
        required: false
        type: string
  # Dispatched by auto-release.yml (via `gh workflow run`, not a reusable
  # `workflow_call`) — releases created there with GITHUB_TOKEN don't emit a
  # `release: published` event (GitHub recursion prevention), so it triggers
  # this workflow_dispatch directly instead. A nested workflow_call was tried
  # first but did not propagate id-token permission to the npm job (confirmed
  # live: ENEEDAUTH, OIDC exchange never attempted) — a top-level
  # workflow_dispatch run gets its own full permission set with no such gap.

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag-ref runs (release event / dispatch on a tag) resolve semver tags from
      # the ref; a workflow_dispatch run from a branch ref (e.g. auto-release.yml's
      # dispatch) has no tag to resolve from, so the version input supplies the tags instead.
      - name: Compute version tags from input
        id: ver
        if: inputs.version != ''
        run: |
          echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          echo "majorminor=$(echo "${{ inputs.version }}" | cut -d. -f1,2)" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/digitalai-opensource/digital-ai-testing-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ steps.ver.outputs.majorminor }},enable=${{ inputs.version != '' }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    # Authenticates via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret.
    # Requires a trusted publisher registered on the npm package pointing at
    # this repo + workflow file (npmjs.com package → Settings → Trusted
    # Publisher). Until that's configured, this job fails safely on its own
    # (doesn't affect the sibling `docker` job or the release itself).
    permissions:
      contents: read
      id-token: write # required for OIDC / Trusted Publishing and --provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Trusted Publishing needs a recent npm CLI — the version bundled with
      # actions/setup-node's Node 22 may predate OIDC support.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          # actions/setup-node injects a dummy placeholder NODE_AUTH_TOKEN
          # whenever registry-url is set, even with no real token configured.
          # A present-but-fake token makes npm authenticate with garbage
          # instead of falling through to the OIDC/Trusted Publishing
          # exchange — clearing it here is what lets Trusted Publishing work.
          NODE_AUTH_TOKEN: ''
