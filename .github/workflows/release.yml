name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Stable (2.4.0) must match package.json and run from main → npm/Docker "latest". Prerelease (2.4.0-beta.1) may run from any branch → npm/Docker "next" only. Blank = package.json version.'
        required: false
        type: string
  # Channel rules live in .github/scripts/release-channel.sh: a prerelease version never touches `latest`
  # (what `npx …@latest` and `docker run --pull=always …:latest` users get), and a stable version can only be
  # published from main or a v* tag. Branch beta build:
  #   gh workflow run release.yml --ref <branch> -f version=2.4.0-beta.1
  # Dispatched by auto-release.yml (via `gh workflow run`, not a reusable
  # `workflow_call`) — releases created there with GITHUB_TOKEN don't emit a
  # `release: published` event (GitHub recursion prevention), so it triggers
  # this workflow_dispatch directly instead. A nested workflow_call was tried
  # first but did not propagate id-token permission to the npm job (confirmed
  # live: ENEEDAUTH, OIDC exchange never attempted) — a top-level
  # workflow_dispatch run gets its own full permission set with no such gap.

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version + channel for every trigger (release event, auto-release dispatch, manual dispatch). For a
      # prerelease it also sets package.json to that version in this runner, so the image reports it.
      - name: Resolve version and channel
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version || github.event.release.tag_name }}
          RELEASE_REF: ${{ github.ref }}
        run: bash .github/scripts/release-channel.sh

      # Stable: <version>, <major.minor>, latest. Prerelease: <version>, next — never latest or major.minor.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/digitalai-opensource/digital-ai-testing-mcp
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.majorminor }},enable=${{ steps.ver.outputs.channel == 'latest' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.channel == 'latest' }}
            type=raw,value=next,enable=${{ steps.ver.outputs.channel == 'next' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # A stable release also becomes `:next` when it is newer than the version `next` points to — unless a newer
      # beta from a working branch is in flight (.github/scripts/next-channel.mjs). Otherwise `docker run …:next`
      # users would keep running a beta older than the release.
      - name: Decide whether next follows this release
        id: next
        if: steps.ver.outputs.channel == 'latest'
        run: node .github/scripts/next-channel.mjs "${{ steps.ver.outputs.version }}"

      - name: Point :next at this release
        if: steps.ver.outputs.channel == 'latest' && steps.next.outputs.move == 'true'
        run: |
          image=ghcr.io/digitalai-opensource/digital-ai-testing-mcp
          docker buildx imagetools create -t "$image:next" "$image:${{ steps.ver.outputs.version }}"
          echo "Docker \`:next\` now points to ${{ steps.ver.outputs.version }} (was ${{ steps.next.outputs.current }})." >> "$GITHUB_STEP_SUMMARY"

  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 45 # the download wait gives up after 25 minutes
    # Authenticates via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret.
    # Requires a trusted publisher registered on the npm package pointing at
    # this repo + workflow file (npmjs.com package → Settings → Trusted
    # Publisher). Until that's configured, this job fails safely on its own
    # (doesn't affect the sibling `docker` job or the release itself).
    permissions:
      contents: read
      id-token: write # required for OIDC / Trusted Publishing and --provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Same rules as the docker job; sets package.json to a prerelease version in this runner before the build.
      - name: Resolve version and channel
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version || github.event.release.tag_name }}
          RELEASE_REF: ${{ github.ref }}
        run: bash .github/scripts/release-channel.sh

      - name: Build
        run: npm run build

      # Trusted Publishing needs a recent npm CLI — the version bundled with
      # actions/setup-node's Node 22 may predate OIDC support.
      - name: Update npm
        run: npm install -g npm@latest

      # Published under `staging`, NOT the release channel: the registry lists a new version minutes before its tarball
      # can be downloaded, and a channel moved at publish time sent every `npx …@latest` to a 404 for ~9 minutes
      # (2.4.2, 2026-11-20). `latest`/`next` move below, once the file can really be downloaded.
      - name: Publish to npm (staging tag)
        id: publish
        run: npm publish --provenance --access public --tag staging
        env:
          # actions/setup-node injects a dummy placeholder NODE_AUTH_TOKEN
          # whenever registry-url is set, even with no real token configured.
          # A present-but-fake token makes npm authenticate with garbage
          # instead of falling through to the OIDC/Trusted Publishing
          # exchange — clearing it here is what lets Trusted Publishing work.
          NODE_AUTH_TOKEN: ''

      # Cache-busted requests until the origin has the file, then the plain URL npm uses, then a margin. Times out
      # (exit 1) rather than move a channel to a version that cannot be downloaded.
      - name: Wait until the new version can be downloaded
        run: node .github/scripts/wait-for-npm.mjs "${{ steps.ver.outputs.version }}"

      # Trusted Publishing may move dist-tags since 2026-09-30 ("Allow npm dist-tag" on the package's trusted publisher,
      # turned on 2026-11-20) — no token.
      - name: Move npm ${{ steps.ver.outputs.channel }} to this release
        id: channel
        run: npm dist-tag add "digital-ai-testing-mcp@${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.channel }}"
        env:
          NODE_AUTH_TOKEN: ''

      # npm's `next` follows a stable release only when the release is newer (same rule as the docker job).
      - name: Check whether npm next should follow this release
        id: next
        if: steps.ver.outputs.channel == 'latest'
        run: node .github/scripts/next-channel.mjs "${{ steps.ver.outputs.version }}"

      - name: Move npm next to this release
        id: nextmove
        if: steps.ver.outputs.channel == 'latest' && steps.next.outputs.move == 'true'
        run: npm dist-tag add "digital-ai-testing-mcp@${{ steps.ver.outputs.version }}" next
        env:
          NODE_AUTH_TOKEN: ''

      - name: Remove the staging tag
        continue-on-error: true
        run: npm dist-tag rm digital-ai-testing-mcp staging
        env:
          NODE_AUTH_TOKEN: ''

      - name: Summary
        run: |
          {
            echo "### npm"
            echo "\`${{ steps.ver.outputs.channel }}\` → ${{ steps.ver.outputs.version }}, moved after the tarball could be downloaded."
            if [[ '${{ steps.nextmove.outcome }}' == 'success' ]]; then echo "\`next\` → ${{ steps.ver.outputs.version }} (was ${{ steps.next.outputs.current }})."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Published, but a channel was not moved (the wait timed out, or the dist-tag permission failed): users keep
      # the previous release, which is the safe side. Say exactly what to run.
      - name: Channel not moved — action needed
        if: failure() && steps.publish.outcome == 'success'
        run: |
          v="${{ steps.ver.outputs.version }}"
          echo "::error title=npm channel not moved::$v is published under 'staging' but '${{ steps.ver.outputs.channel }}' still points to the previous release."
          {
            echo "### Action needed: npm channel not moved"
            echo "$v is published (dist-tag \`staging\`), but \`${{ steps.ver.outputs.channel }}\` was not moved, so users still get the previous release."
            echo "Check that \`npm view digital-ai-testing-mcp@$v\` works, then, with your npm login:"
            echo
            echo '```'
            echo "npm dist-tag add digital-ai-testing-mcp@$v ${{ steps.ver.outputs.channel }}"
            if [[ '${{ steps.ver.outputs.channel }}' == 'latest' ]]; then echo "# and, if next is older than $v:"; echo "npm dist-tag add digital-ai-testing-mcp@$v next"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
